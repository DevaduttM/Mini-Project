version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      FLASK_DEBUG: "0"
    volumes:
      - backend_uploads:/app/uploads
      - backend_audio:/app/audio
      - backend_faces:/app/faces
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://backend:5000"
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_audio:
  backend_faces:
